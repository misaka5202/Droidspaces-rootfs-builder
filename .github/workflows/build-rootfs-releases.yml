name: Build and Release Droidspaces RootFS

on:
  workflow_dispatch:
    inputs:
      update_json_only:
        description: '仅更新 rootfs.json（跳过构建与发布）'
        type: boolean
        default: false
      build_target:
        description: '选择要构建的发行版模板'
        required: true
        type: choice
        default: 'Ubuntu-22.04-XFCE'
        options:
          - 'Ubuntu-22.04-XFCE'
          - 'Ubuntu-24-KDE'
          - 'Ubuntu-24.04-XFCE'
          - 'Ubuntu-22.04-Minimal'
          - 'all'
      build_nixos:
        description: '同时构建 NixOS 变体'
        type: boolean
        default: false
      custom_username:
        description: '自定义用户名（默认 Gold）'
        required: false
        type: string
        default: 'Gold'
      build_desktop:
        description: '桌面规模（XFCE/KDE：conc=精简 min=最小 none=不装桌面；其它模板忽略）'
        required: true
        type: choice
        default: 'min'
        options:
          - 'conc'
          - 'min'
          - 'none'
      build_desktop_plus:
        description: '桌面开机自启动（需桌面选 conc 或 min；Termux:X11 DISPLAY=:5）'
        type: boolean
        default: false
      PulseAudio:
        description: 'PulseAudio 音频转发'
        required: true
        type: choice
        default: 'socket'
        options:
          - 'socket'
          - 'tcp'
          - 'none'
      enable_zh_tz:
        description: '中文语言 + Asia/Shanghai 时区'
        type: boolean
        default: true
      enable_srf:
        description: '安装 Fcitx5 输入法（中文开启时额外装中文输入支持）'
        type: boolean
        default: true
      enable_mesa:
        description: '高通骁龙 GPU（mesa-for-android-container）'
        type: boolean
        default: true
      enable_yj:
        description: '容器 NAT / 硬件与网络识别增强'
        type: boolean
        default: true
      enable_binfmt:
        description: '跨架构支持（qemu-user-static / binfmt）'
        type: boolean
        default: false
      enable_kfgj:
        description: '集成开发工具'
        type: boolean
        default: false
      enable_zip:
        description: '集成压缩工具'
        type: boolean
        default: true
      enable_docker:
        description: '集成 Docker'
        type: boolean
        default: false
      enable_tmoe:
        description: '集成 TMOE'
        type: boolean
        default: false
      enable_nosnap:
        description: 'nosnap：移除 Ubuntu Snap'
        type: boolean
        default: false

jobs:
  setup:
    if: ${{ github.event.inputs.update_json_only != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.find-templates.outputs.templates }}
      build_id: ${{ steps.prep.outputs.build_id }}
      build_date: ${{ steps.prep.outputs.build_date }}
      build_nixos: ${{ steps.find-templates.outputs.build_nixos }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse build target
        id: find-templates
        run: |
          TARGET="${{ github.event.inputs.build_target || 'all' }}"
          BUILD_NIXOS="${{ github.event.inputs.build_nixos || 'false' }}"

          if [ "$TARGET" = "all" ] || [ -z "$TARGET" ]; then
            TEMPLATES=$(ls *.Dockerfile | sed 's/\.Dockerfile//' | jq -R -s -c 'split("\n")[:-1]')
          else
            if [ ! -f "${TARGET}.Dockerfile" ]; then
              echo "❌ 找不到模板: ${TARGET}.Dockerfile"
              exit 1
            fi
            TEMPLATES=$(jq -n -c --arg t "$TARGET" '[$t]')
          fi

          echo "templates=$TEMPLATES" >> $GITHUB_OUTPUT
          echo "build_nixos=$BUILD_NIXOS" >> $GITHUB_OUTPUT
          echo "构建矩阵: $TEMPLATES"
          echo "构建 NixOS: $BUILD_NIXOS"

      - name: Prepare Build Metadata
        id: prep
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')
          BUILD_ID="v$(date +'%Y%m%d-%H%M%S')"
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build ID: $BUILD_ID"

  build:
    if: ${{ github.event.inputs.update_json_only != 'true' && needs.setup.outputs.templates != '[]' }}
    needs: setup
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.setup.outputs.templates) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify build options
        run: |
          DESKTOP="${{ github.event.inputs.build_desktop || 'min' }}"
          DESKTOP_PLUS="${{ github.event.inputs.build_desktop_plus || 'false' }}"
          if [ "$DESKTOP" = "none" ] && [ "$DESKTOP_PLUS" = "true" ]; then
            echo "❌ 错误: 桌面选 none 时不能启用开机自启动"
            exit 1
          fi

      - name: Build RootFS (${{ matrix.template }})
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x build_rootfs-native.sh
          ./build_rootfs-native.sh \
            -i "${{ matrix.template }}.Dockerfile" \
            -v "${{ needs.setup.outputs.build_id }}" \
            -K "${{ github.event.inputs.build_desktop || 'min' }}" \
            -L "${{ github.event.inputs.build_desktop_plus || 'false' }}" \
            -P "${{ github.event.inputs.PulseAudio || 'socket' }}" \
            -g "${{ github.event.inputs.enable_zh_tz || 'true' }}" \
            -a "${{ github.event.inputs.enable_binfmt || 'false' }}" \
            -b "${{ github.event.inputs.enable_yj || 'true' }}" \
            -c "${{ github.event.inputs.enable_mesa || 'true' }}" \
            -d "${{ github.event.inputs.enable_kfgj || 'false' }}" \
            -e "${{ github.event.inputs.enable_zip || 'true' }}" \
            -f "${{ github.event.inputs.enable_docker || 'false' }}" \
            -h "${{ github.event.inputs.enable_srf || 'true' }}" \
            -j "${{ github.event.inputs.enable_tmoe || 'false' }}" \
            -n "${{ github.event.inputs.enable_nosnap || 'false' }}" \
            -u "${{ github.event.inputs.custom_username || 'Gold' }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.template }}-rootfs
          path: "*.tar.xz"
          retention-days: 1

  build-nixos:
    if: ${{ github.event.inputs.update_json_only != 'true' && needs.setup.outputs.build_nixos == 'true' }}
    needs: setup
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NixOS-Minimal-Systemd-latest-Kernel-5.10-and-up
            attr: nixosDroidspacesTarballs.aarch64-linux.minimal
          - name: NixOS-Minimal-Systemd-v257.9
            attr: nixosDroidspacesTarballs.aarch64-linux.minimal-with-systemd-v257
          - name: NixOS-Minimal-Finix-Experimental
            attr: finixDroidspacesTarballs.aarch64-linux.experimental
    steps:
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Build ${{ matrix.name }} RootFS
        run: |
          nix build github:ravindu644/Droidspaces-OSS#${{ matrix.attr }}

      - name: Package artifact
        run: |
          DATE=$(date +%Y%m%d)
          TARBALL=$(find result/tarball -name "*.tar.xz" | head -1)
          FINAL="${{ matrix.name }}-Droidspaces-rootfs-aarch64-${DATE}-${{ needs.setup.outputs.build_id }}.tar.xz"
          cp "$TARBALL" "$FINAL"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-rootfs
          path: "*.tar.xz"
          retention-days: 1

  release:
    # build-nixos 在手动构建取消勾选时可跳过，此时仍应发布已有产物
    if: ${{ always() && !cancelled() && github.event.inputs.update_json_only != 'true' && needs.setup.result == 'success' && needs.build.result == 'success' && (needs.build-nixos.result == 'success' || needs.build-nixos.result == 'skipped') }}
    needs: [setup, build, build-nixos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-rootfs"
          merge-multiple: true

      - name: Create Unified Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.build_id }}
          name: "Droidspaces RootFS ${{ needs.setup.outputs.build_id }}"
          files: "*.tar.xz"
          body: |
            Droidspaces RootFS 自动构建
            构建时间: ${{ needs.setup.outputs.build_date }}
            构建目标: ${{ github.event.inputs.build_target || 'all' }}
            Build ID: ${{ needs.setup.outputs.build_id }}

            构建选项:
            - 自定义用户名: ${{ github.event.inputs.custom_username || 'Gold' }}
            - 桌面规模: ${{ github.event.inputs.build_desktop || 'min' }}
            - 桌面开机自启动: ${{ github.event.inputs.build_desktop_plus || 'false' }}
            - PulseAudio: ${{ github.event.inputs.PulseAudio || 'socket' }}
            - 中文语言/时区: ${{ github.event.inputs.enable_zh_tz || 'true' }}
            - Fcitx5: ${{ github.event.inputs.enable_srf || 'true' }}
            - 骁龙 GPU: ${{ github.event.inputs.enable_mesa || 'true' }}
            - NAT/硬件识别: ${{ github.event.inputs.enable_yj || 'true' }}
            - 跨架构 binfmt: ${{ github.event.inputs.enable_binfmt || 'false' }}
            - 开发工具: ${{ github.event.inputs.enable_kfgj || 'false' }}
            - 压缩工具: ${{ github.event.inputs.enable_zip || 'true' }}
            - Docker: ${{ github.event.inputs.enable_docker || 'false' }}
            - TMOE: ${{ github.event.inputs.enable_tmoe || 'false' }}
            - nosnap: ${{ github.event.inputs.enable_nosnap || 'false' }}
            - NixOS 变体: ${{ needs.setup.outputs.build_nixos }}

            Included Templates:
            ${{ join(fromJson(needs.setup.outputs.templates), ', ') }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update rootfs.json Registry
        run: |
          python3 scripts/update_rootfs_json.py .

      - name: Commit and Push rootfs.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rootfs.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update rootfs.json for release ${{ needs.setup.outputs.build_id }}"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes in rootfs.json to push."
          fi

  update-json:
    needs: [release]
    if: always() && (needs.release.result == 'success' || github.event.inputs.update_json_only == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update rootfs.json Registry
        run: python3 scripts/update_rootfs_json.py .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push rootfs.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rootfs.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update rootfs.json"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes in rootfs.json to push."
          fi
